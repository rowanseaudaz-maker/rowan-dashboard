<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROWAN - Dashboard de Gestión</title>
    <!-- Tailwind CSS para diseño moderno y minimalista -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-zinc-800 pb-6 mb-8">
            <div>
                <h1 class="text-2xl font-bold tracking-wider">ROWAN</h1>
                <p class="text-xs text-zinc-400 uppercase tracking-widest">Sistema de Gestión y Proveedores</p>
            </div>
            <div id="status" class="text-xs px-3 py-1 bg-zinc-900 border border-zinc-800 rounded text-zinc-400">
                Conectando a Base de Datos...
            </div>
        </header>

        <!-- Grid Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulario de Carga (Módulo Proveedores) -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-lg lg:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-zinc-200">Carga de Proveedor</h2>
                <form id="productForm" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1">Proveedor</label>
                        <input type="text" id="proveedor" required placeholder="Ej: Spartan / Marroquinería" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1">Descripción del Proveedor</label>
                        <input type="text" id="desc_proveedor" required placeholder="Ej: Mochila Messi" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1">Categoría</label>
                        <select id="categoria" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                            <option value="Mochilas">Mochilas</option>
                            <option value="Riñoneras">Riñoneras</option>
                            <option value="Neceres">Neceres</option>
                            <option value="Relojes">Relojes</option>
                            <option value="Cintos">Cintos</option>
                            <option value="Tote Bags">Tote Bags</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1">Color / Variante</label>
                        <input type="text" id="color" placeholder="Ej: Negro" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs uppercase text-zinc-400 mb-1">Costo Proveedor ($)</label>
                            <input type="number" id="costo_prov" required class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-zinc-400 mb-1">Costo Packaging ($)</label>
                            <input type="number" id="costo_pack" value="1000" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1">Precio de Venta Manual ($)</label>
                        <input type="number" id="precio_venta" required class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs uppercase text-zinc-400 mb-1">Peso (kg)</label>
                            <input type="number" step="0.01" id="peso" placeholder="0.65" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-zinc-400 mb-1">Medidas</label>
                            <input type="text" id="medidas" placeholder="40x30x15 cm" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-zinc-100 text-zinc-950 font-medium py-2 rounded text-sm hover:bg-zinc-200 transition">
                        Generar y Guardar Artículo
                    </button>
                </form>
            </div>

            <!-- Listado de Artículos Generados -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-lg lg:col-span-2">
                <h2 class="text-lg font-semibold mb-4 text-zinc-200">Catálogo y Artículos ROWAN</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="border-b border-zinc-800 text-zinc-400 uppercase text-xs">
                            <tr>
                                <th class="pb-3">SKU</th>
                                <th class="pb-3">Artículo ROWAN</th>
                                <th class="pb-3">Categoría</th>
                                <th class="pb-3">Costo Real</th>
                                <th class="pb-3">Precio Venta</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="divide-y divide-zinc-800 text-zinc-300">
                            <!-- Los productos se cargarán dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de lógica y conexión con Supabase -->
    <script src="app.js"></script>
</body>
</html>
